name: Terraform Azure Infrastructure

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false


# ============================================================
# STAGE 1 - SECURITY SCAN
# ============================================================

jobs:

  security-scan:

    name: Security Scan

    runs-on: self-hosted

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # CREATE LOCAL TOOL DIRECTORY
      # ========================================================

      - name: Create Security Tools Directory
        shell: powershell
        run: |
          $tools = "$env:RUNNER_TEMP\security-tools"

          if (Test-Path $tools) {
              Remove-Item $tools -Recurse -Force
          }

          New-Item -ItemType Directory -Path $tools -Force

          Write-Host "Security tools directory:"
          Write-Host $tools


      # ========================================================
      # INSTALL TRIVY
      # ========================================================

      - name: Download Trivy
        shell: powershell
        run: |

          $tools = "$env:RUNNER_TEMP\security-tools"
          $trivyDir = "$tools\trivy"

          New-Item -ItemType Directory -Path $trivyDir -Force

          Write-Host "Downloading Trivy..."

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest" `
            -Headers @{ "User-Agent" = "GitHubActions" }

          $asset = $release.assets |
            Where-Object {
              $_.name -match "windows-64bit.zip$"
            } |
            Select-Object -First 1

          if (-not $asset) {
              throw "Trivy Windows 64-bit ZIP not found."
          }

          Write-Host "Trivy asset:"
          Write-Host $asset.name

          $zip = "$tools\trivy.zip"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath $trivyDir `
            -Force

          $trivyExe = Get-ChildItem `
            -Path $trivyDir `
            -Filter "trivy.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $trivyExe) {
              throw "trivy.exe not found after extraction."
          }

          Write-Host "Trivy installed at:"
          Write-Host $trivyExe.FullName

          # Add only for this workflow
          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $trivyExe.DirectoryName


      # ========================================================
      # INSTALL CHECKOV
      # ========================================================

      - name: Install Checkov
        shell: powershell
        run: |

          $checkovDir = "$env:RUNNER_TEMP\checkov"

          if (Test-Path $checkovDir) {
              Remove-Item $checkovDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $checkovDir -Force

          Write-Host "Installing Checkov..."

          python -m pip install --upgrade pip

          python -m pip install `
            --target "$checkovDir" `
            checkov

          Write-Host "Checkov installation completed."

          Write-Host "Checking Checkov files..."

          Get-ChildItem "$checkovDir\Scripts" -ErrorAction SilentlyContinue

          Get-ChildItem "$checkovDir" -Filter "checkov*" -Recurse


      # ========================================================
      # INSTALL GITLEAKS
      # ========================================================

      - name: Download Gitleaks
        shell: powershell
        run: |

          $tools = "$env:RUNNER_TEMP\security-tools"
          $gitleaksDir = "$tools\gitleaks"

          New-Item `
            -ItemType Directory `
            -Path $gitleaksDir `
            -Force

          Write-Host "Downloading Gitleaks..."

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest" `
            -Headers @{ "User-Agent" = "GitHubActions" }

          $asset = $release.assets |
            Where-Object {
              $_.name -match "windows_x64.zip$"
            } |
            Select-Object -First 1

          if (-not $asset) {
              throw "Gitleaks Windows x64 ZIP not found."
          }

          Write-Host "Gitleaks asset:"
          Write-Host $asset.name

          $zip = "$tools\gitleaks.zip"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath $gitleaksDir `
            -Force

          $gitleaksExe = Get-ChildItem `
            -Path $gitleaksDir `
            -Filter "gitleaks.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $gitleaksExe) {
              throw "gitleaks.exe not found after extraction."
          }

          Write-Host "Gitleaks installed at:"
          Write-Host $gitleaksExe.FullName

          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $gitleaksExe.DirectoryName


      # ========================================================
      # VERIFY TOOLS
      # ========================================================

      - name: Verify Security Tools
        shell: powershell
        run: |

          Write-Host "=============================="
          Write-Host "Security Tool Versions"
          Write-Host "=============================="

          trivy --version

          python -m checkov --version

          gitleaks version


      # ========================================================
      # TRIVY SCAN
      # ========================================================

      - name: Trivy IaC Scan
        shell: powershell
        run: |

          Write-Host "=============================="
          Write-Host "TRIVY IaC SCAN"
          Write-Host "=============================="

          trivy config . `
            --severity HIGH,CRITICAL `
            --exit-code 1


      # ========================================================
      # CHECKOV SCAN
      # ========================================================

      - name: Checkov Terraform Scan
        shell: powershell
        run: |

          Write-Host "=============================="
          Write-Host "CHECKOV TERRAFORM SCAN"
          Write-Host "=============================="

          $checkovDir = "$env:RUNNER_TEMP\checkov"

          $checkovExe = Get-ChildItem `
            -Path $checkovDir `
            -Filter "checkov.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $checkovExe) {
              throw "Checkov executable not found."
          }

          Write-Host "Checkov executable:"
          Write-Host $checkovExe.FullName

          & $checkovExe.FullName `
            -d . `
            --framework terraform `
            --compact

      # ========================================================
      # GITLEAKS SCAN
      # ========================================================

      - name: Gitleaks Secret Scan
        shell: powershell
        run: |

          Write-Host "=============================="
          Write-Host "GITLEAKS SECRET SCAN"
          Write-Host "=============================="

          gitleaks dir . `
            --redact `
            --exit-code 1


  # ============================================================
  # STAGE 2 - TERRAFORM PLAN
  # ============================================================

  terraform-plan:

    name: Terraform Plan

    needs:
      - security-scan

    if: >
      needs.security-scan.result == 'success'

    runs-on: self-hosted

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ========================================================
      # AZURE OIDC
      # ========================================================

      - name: Azure Login - OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Verify Azure
      # --------------------------------------------------------

      - name: Verify Azure Login
        shell: powershell
        run: |
          az account show


      # ========================================================
      # TERRAFORM
      # ========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4


      - name: Terraform Format Check
        shell: powershell
        run: |
          terraform fmt -check -recursive


      - name: Terraform Init
        working-directory: environments/dev
        shell: powershell
        run: |
          terraform init -input=false


      - name: Terraform Validate
        working-directory: environments/dev
        shell: powershell
        run: |
          terraform validate


      - name: Terraform Plan
        working-directory: environments/dev
        shell: powershell
        run: |
          terraform plan `
            -input=false `
            -out=tfplan


      # --------------------------------------------------------
      # Upload Plan
      # --------------------------------------------------------

      - name: Upload Terraform Plan
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'

        uses: actions/upload-artifact@v4

        with:
          name: terraform-plan
          path: environments/dev/tfplan
          retention-days: 1


  # ============================================================
  # STAGE 3 - MANUAL APPROVAL + APPLY
  # ============================================================

  terraform-apply:

    name: Manual Approval - Terraform Apply

    needs:
      - terraform-plan

    if: >
      needs.terraform-plan.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: self-hosted

    environment:
      name: production

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ========================================================
      # AZURE OIDC
      # ========================================================

      - name: Azure Login - OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Verify Azure
      # --------------------------------------------------------

      - name: Verify Azure Login
        shell: powershell
        run: |
          az account show


      # ========================================================
      # TERRAFORM
      # ========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4


      - name: Terraform Init
        working-directory: environments/dev
        shell: powershell
        run: |
          terraform init -input=false


      # --------------------------------------------------------
      # Download Plan
      # --------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: environments/dev


      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: environments/dev
        shell: powershell
        run: |
          terraform apply `
            -input=false `
            -auto-approve `
            tfplan
